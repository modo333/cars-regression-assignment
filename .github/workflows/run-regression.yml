name: Run regression

on:
  workflow_dispatch:
  push:
    paths:
      - regression_cars.py
      - neural_network.py
      - cars.csv
      - requirements.txt
      - .github/workflows/run-regression.yml

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install packages
        run: python -m pip install -r requirements.txt
      - name: Run regression
        run: python regression_cars.py
      - name: Upload graph
        uses: actions/upload-artifact@v6
        with:
          name: regression-graph
          path: cars_regression.png
